<!doctype html><html lang="en" data-workspace-theme="classic"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace select local review</title><link rel="stylesheet" href="/workspace-select.css"><style>body{margin:0;background:#f7f7f7;color:#202020;font:15px/1.5 system-ui,sans-serif;--theme-panel:#fff;--theme-heading:#202020;--theme-line:#dedede;--theme-control-line:#999;--theme-inset:#f7f7f7}.shell{padding:24px;max-width:600px;margin:auto}form{display:grid;gap:20px}label{display:grid;gap:9px}button{min-height:44px;padding:10px 20px}output{display:block;margin-top:15px;overflow-wrap:anywhere}</style><script defer src="/workspace-select.js"></script></head><body><main class="shell jb-reference"><h1>Choose your country</h1><form><label>Country<select name="country" required><option value="GB">United Kingdom</option><option value="US">United States</option><option value="CA">Canada</option><option value="AU">Australia</option></select></label><label>Time zone<select name="timezone" required><option value="Europe/London">Europe/London</option></select></label><label>Required choice<select name="required" required><option value="">Choose an option</option><option value="one">One</option><option disabled value="two">Two (disabled)</option><option value="three">Three</option></select></label><label>Disabled control<select disabled><option>Unavailable</option></select></label><button type="submit">Review form</button><button type="reset">Reset</button></form><output aria-live="polite">No submitted form.</output></main><script>document.querySelector('[name=country]').addEventListener('change',event=>{const zones={GB:['Europe/London'],US:['America/New_York','America/Chicago','America/Denver','America/Los_Angeles'],CA:['America/Toronto','America/Vancouver'],AU:['Australia/Sydney','Australia/Perth']};document.querySelector('[name=timezone]').innerHTML=zones[event.target.value].map(zone=>'<option>'+zone+'</option>').join('')});document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('output').textContent=JSON.stringify(Object.fromEntries(new FormData(event.target)))});</script></body></html>
