name: Website regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
concurrency:
  group: regression-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.deployment.id || github.ref }}-${{ github.event.deployment_status.state }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run regression
      - if: ${{ !cancelled() }}
        run: node scripts/performance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-production-build
          path: artifacts/lighthouse/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: regression-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jovabook-billing-customer-proof
          path: |
            output/billing-access-after/
            output/billing-plans-after/
            output/jovabook-customer-portal/
            output/customer-portal-host-after/
            output/existing-business-after/
            output/jovabook-booking-horizon/
          if-no-files-found: ignore
          retention-days: 7
  booking-ui:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node booking-demo/tests/business-website-browser.mjs
      - run: node booking-demo/tests/sidebar-alignment-browser.mjs
      - run: node booking-demo/tests/business-settings-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jovabook-website-settings-proof
          path: |
            output/jovabook-business-website/
            booking-demo/test-results/sidebar-alignment/after/
            booking-demo/test-results/business-settings/after/
          if-no-files-found: ignore
          retention-days: 7
  live-regression:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.production_environment == true ||
       startsWith(github.event.deployment.environment, 'Production') ||
       github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REGRESSION_URL: https://www.jovamedia.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run regression
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: live-regression-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
